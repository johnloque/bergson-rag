services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # api:        # added in Sprint 7
  # frontend:   # added in Sprint 8

volumes:
  qdrant_data:
