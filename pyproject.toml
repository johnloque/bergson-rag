[project]
name = "bergson-rag"
version = "0.1.0"
description = "Local RAG chatbot on the complete works of Henri Bergson"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# ragas pinned below 0.4: ragas 0.4.x unconditionally imports
# langchain_community.chat_models.vertexai at module load time, a path
# langchain-community has since dropped entirely (its own churn, unrelated to
# this project) — breaks `import ragas` for every non-VertexAI user
# regardless of provider (github.com/explodinggradients/ragas issues #2741,
# #2745, #2753, open as of this pin). langchain-community itself is pinned
# for the same reason: ragas does not pin it, and the latest release also
# lacks that module, so an unconstrained resolve reintroduces the crash even
# with ragas<0.4. Revisit both pins once upstream ships a fix.
# langchain-litellm: the actively maintained standalone package for
# LiteLLM-via-langchain (src/generation/faithfulness.py) — not
# langchain_community's own ChatLiteLLM, which langchain-community's own
# deprecation warning points away from.
dependencies = [
    "fastapi==0.141.1",
    "fastembed==0.8.0",
    "fr-core-news-lg==3.8.0",
    "langchain-community==0.3.30",
    "langchain-litellm==0.7.0",
    "litellm==1.97.0",
    "qdrant-client==1.19.0",
    "ragas==0.3.9",
    "sentence-transformers==5.7.0",
    "snowballstemmer==3.1.1",
    "spacy==3.8.15",
    "sqlmodel==0.0.29",
    "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_xml_audit_report.py" = ["E501"]

# fastapi.Depends()-in-default-argument is the standard, idiomatic FastAPI
# dependency-injection pattern (src/api/main.py) — not a mutable-default
# footgun like the bare-list/dict case B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
fr-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_lg-3.8.0/fr_core_news_lg-3.8.0-py3-none-any.whl" }

# Model versions not installable as Python packages, pinned here as the
# single source of truth (read at runtime by src/indexing/embeddings.py).
[tool.bergson.model-versions]
# BAAI/bge-m3 dense embeddings — HF commit, since the model itself has no
# package version.
bge_m3_revision = "5617a9f61b028005a4858fdac845db406aefb181"
# BAAI/bge-reranker-v2-m3 cross-encoder reranker — HF commit, same rationale
# (src/retrieval/reranking.py).
bge_reranker_v2_m3_revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
