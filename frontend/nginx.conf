# react-router-dom's BrowserRouter (frontend/src/App.tsx) needs every
# unknown path served index.html so client-side routing can take over --
# without this, a hard reload on e.g. /conversations/3 404s.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
