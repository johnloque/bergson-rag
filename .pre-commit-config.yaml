repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Golden prompt snapshots are compared byte-for-byte against what the
      # LLM receives (tests/test_prompt_snapshots.py, docs/prompts.md) —
      # e.g. RAGAS ends every prompt with a trailing "Output: " and no
      # newline. Whitespace "fixes" there would corrupt them.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/prompt_snapshots/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/prompt_snapshots/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
