  polarity rule in the nli_verifier instruction (a statement that denies
  what the context affirms, or the reverse, gets 0; a negation the context
  states is supported; the verdict must agree with the reason), plus one
  off-domain few-shot example with both cases. segment_claims and the
  schema unchanged. Question: does the judge now reject the negated claim
  on Q008-p1, Q002-p2 and Q010-p2 without flagging more faithful
  statements (gold answers hold legitimate negations, e.g. Q008's clou)?
