  (eval/results/prompt_cmp_judgebase_default_20261011T120058Z.md) misses
  Q008-p1-negation in 6 of 6 repeats: « le cérébral et le mental ne sont
  pas solidaires » is judged supported with a self-contradicting reason
  (the context asserts « une certaine solidarité »). Reading the claims,
  the judge rejects the negated claim itself on 1 of 4 negation items only
  (Q004-p1); Q002-p2's negation is accepted and the gold's affirmative
