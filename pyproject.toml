[project]
name = "bergson-rag"
version = "0.1.0"
description = "Local RAG chatbot on the complete works of Henri Bergson"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_xml_audit_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
