services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The qdrant image ships no curl/wget (Debian-slim base) but does
      # have bash, so the health ping is a raw HTTP/1.1 request over
      # bash's /dev/tcp rather than a package we'd have to add.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q '200 OK'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Opt-in only (docs/dockerization.md): `docker compose up` does NOT
  # start this service. Docker Desktop on Apple Silicon has no Metal
  # passthrough, so containerized Ollama runs CPU-only -- measured 3-5x
  # slower than native host Ollama. Native (via `make setup-ollama`) is
  # the default path; this service is the explicit fallback, started with
  # `docker compose --profile with-ollama up` / `make run-with-ollama`.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"   # host-side debugging convenience only -- the api
                         # container talks to ollama over the internal
                         # network (OLLAMA_API_BASE below), never this
                         # published port
    volumes:
      - ollama_data:/root/.ollama   # model persistence across restarts --
                                     # the container itself starts with no
                                     # models; `make run-with-ollama` pulls
                                     # one explicitly (see Makefile)
    restart: unless-stopped
    # CPU-only inference: no GPU passthrough is configured here (Docker
    # Desktop on Apple Silicon can't do Metal passthrough at all). Fine
    # for the opt-in fallback path; not a production performance target.
    healthcheck:
      # `ollama list` is a real client call to the local server (not just
      # a port probe) and needs no curl/wget, which this image doesn't
      # ship either -- it succeeds as soon as the server responds, even
      # with zero models pulled yet.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Internal Docker service names: correct here because this is
      # container-to-container traffic -- unlike the frontend's
      # VITE_API_BASE below, which the *browser* has to reach and must
      # never be an internal service name.
      QDRANT_URL: http://qdrant:6333
      # litellm's ollama_chat provider (src/generation/generate.py's
      # DEFAULT_MODEL = "ollama_chat/mistral") reads OLLAMA_API_BASE
      # specifically, not a generic OLLAMA_URL/OLLAMA_HOST -- see
      # litellm/llms/ollama/common_utils.py. Setting the wrong env var
      # name here would silently leave it defaulting to
      # http://localhost:11434, i.e. the api container itself, and every
      # generate/judge call would fail to reach ollama.
      #
      # Default is native host Ollama (host.docker.internal, the fast
      # Metal-accelerated path on Mac -- see docs/dockerization.md).
      # Override to http://ollama:11434 when running with the
      # `with-ollama` Compose profile instead (`make run-with-ollama`).
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # feat/native-ml-service (docs/dockerization.md): same native-by-
      # default, containerized-opt-in split as OLLAMA_API_BASE above, now
      # applied to dense/sparse embedding and cross-encoder reranking (the
      # ~31x CPU-in-container slowdown measured for reranking alone). No
      # `ml_service` service block exists in this file -- it's started
      # natively (`make setup-ml-service` / scripts/setup_ml_service.sh),
      # never containerized by default. Set here (host.docker.internal --
      # same host.docker.internal:host-gateway extra_hosts entry below
      # already makes this resolve) so `api` reaches it by default; a
      # fully-containerized stack is still possible by simply not running
      # that script and overriding this to an empty string, which falls
      # back to src/api/dependencies.py's pre-existing in-process model
      # loading.
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8100}
      # Additive to FRONTEND_DEV_ORIGIN (src/api/main.py), which stays
      # hardcoded for the non-Docker `npm run dev` workflow. Must match
      # the frontend service's host-mapped port below.
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - .env   # MISTRAL_API_KEY / ANTHROPIC_API_KEY / HF_TOKEN -- passed
               # through from the host's .env, never baked into the image
    volumes:
      - ./data:/app/data   # data/app.db (SQLite persistence, BERGSON_DB_
                            # PATH default) lives here, same relative path
                            # as the non-Docker dev flow -- survives
                            # `docker compose down`
      - hf_cache:/root/.cache/huggingface   # BGE-M3 + cross-encoder
                            # reranker weights (sentence-transformers,
                            # src/indexing/embeddings.py, src/retrieval/
                            # reranking.py). Without this, every container
                            # recreation re-downloads several GB from
                            # Hugging Face on the first /retrieve call.
    depends_on:
      qdrant:
        condition: service_healthy
      # `required: false`: ollama is opt-in (`with-ollama` profile, see
      # above). When that profile isn't active, this dependency is
      # skipped entirely -- api starts against native host Ollama with no
      # wait. When it IS active, api still waits for the container's
      # healthcheck before starting, same as before this branch.
      ollama:
        condition: service_healthy
        required: false
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (Mac/
      # Windows) but not on native Linux Docker Engine -- this makes the
      # native-Ollama default (OLLAMA_API_BASE above) resolve there too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # CRITICAL (docs/ROADMAP.md, Sprint 9): baked into the JS bundle
        # at build time (Vite/the browser has no access to a runtime
        # `environment:` entry) and must be a URL the user's BROWSER can
        # reach -- the api service's host-mapped port above, never the
        # internal service name (http://api:8000), which only resolves
        # container-to-container. scripts/test_frontend_arg.sh guards
        # against getting this backwards.
        VITE_API_BASE: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  hf_cache:
